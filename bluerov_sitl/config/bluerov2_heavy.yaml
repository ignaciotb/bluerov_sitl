bluerov_sitl:
  ros__parameters:
    # Generated by: scripts/extract_motor_matrix.py (see scripts/fetch_ardusub_reference.sh)
    # Point this at the YAML produced by the extractor, NOT the placeholder
    # test fixture under test/fixtures/.
    motor_matrix_path: "config/motor_matrix_vectored_6dof.yaml"

    # Bidirectional ESC PWM convention (T200 thrusters via BlueESC/Basic ESC)
    motor_pwm_min: 1100
    motor_pwm_trim: 1500
    motor_pwm_max: 1900

    # RC input channel PWM range, matches ArduSub/radio.cpp defaults
    rc_pwm_min: 1100
    rc_pwm_trim: 1500
    rc_pwm_max: 1900
    override_timeout_s: 3.0

    # Deadzones (microseconds), from ArduSub/radio.cpp Sub::init_rc_in().
    # Also auto-extracted into motor_matrix_vectored_6dof.yaml -- keep
    # these two in sync if you change one.
    #
    # NOTE: MANUAL mode does NOT apply these. ArduSub/mode_manual.cpp uses
    # norm_input(), which has no deadzone; only the stabilized modes use
    # norm_input_dz(). They are kept here for when those get implemented.
    deadzone_pitch_us: 30
    deadzone_roll_us: 30
    deadzone_throttle_us: 30
    deadzone_yaw_us: 40
    deadzone_forward_us: 30
    deadzone_lateral_us: 30

    # Default ArduSub RCMAP_* channel assignment (1-indexed), see
    # ardusub.com/developers/rc-input-and-output.html
    channel_pitch: 1
    channel_roll: 2
    channel_throttle: 3
    channel_yaw: 4
    channel_forward: 5
    channel_lateral: 6

    # Per-thruster direction, in motor-number order (motor 1 .. motor 8).
    # This is AP_Motors6DOF::_motor_reverse[], i.e. your vehicle's
    # MOT_1_DIRECTION .. MOT_8_DIRECTION parameters. It is the ONE value
    # in this file that cannot be derived from the ArduSub source: it
    # records how the props and ESCs on YOUR hull were wired.
    #
    # Read them off the vehicle, e.g.:
    #   ros2 param get /mavros/param MOT_1_DIRECTION      # (via mavros param plugin)
    # or just look at the parameter list in QGroundControl.
    #
    # Solving for these from a real-vs-sim thruster comparison run
    # (rosbag2_2026_08_26-12_07_22) gave [-1, -1, 1, 1, -1, 1, 1, -1] for
    # motors 1..8. Motors 1 and 2 are confirmed by three independent axes
    # (forward, lateral, yaw). Motors 5-8 rest on the throttle axis alone,
    # because that run never exercised roll or pitch -- exercise those and
    # re-check before trusting the vertical stack's signs.
    motor_direction: [-1, -1, 1, 1, -1, 1, 1, -1]

    # ArduSub/mode_manual.cpp scales yaw by g.acro_yaw_p / ACRO_YAW_P.
    # Both default to 3.375 (ArduSub/config.h), so leave at 1.0 unless
    # you have retuned ACRO_YAW_P on the vehicle.
    yaw_scale: 1.0

    # ------------------------------------------------------------------
    # Flight mode: "manual" or "stabilize". Switch at runtime with
    #   ros2 param set /bluerov_sitl flight_mode stabilize
    # ------------------------------------------------------------------
    flight_mode: "stabilize"

    # --- STABILIZE only. MANUAL ignores everything below. --------------
    # STABILIZE is a CLOSED LOOP: it needs the vehicle's attitude. Without
    # fresh data on this topic the node holds every thruster neutral rather
    # than stabilizing against a stale orientation.
    imu_topic: "/BlueROV2_Heavy/mavros/imu/data_raw"
    attitude_timeout_s: 0.5

    # Frame of the incoming IMU attitude/rates.
    #   "ros"       -- REP-103, world ENU + body FLU. What mavros publishes
    #                  for BOTH a real vehicle and the Unity sim, so this is
    #                  the right default.
    #   "ardupilot" -- world NED + body FRD, i.e. already converted.
    # ROS and ArduPilot agree on roll but have OPPOSITE pitch and yaw, and
    # the thruster matrix is in ArduPilot's convention. Getting this wrong
    # drives pitch and yaw AWAY from the target until the vehicle tumbles --
    # exactly what rosbag2_2026_08_28-13_52_55 recorded.
    imu_frame: "ros"

    # ArduSub/config.h:113 ACRO_YAW_P -- pilot yaw stick to target yaw RATE.
    acro_yaw_p: 3.375

    # ATC_ANGLE_MAX in centidegrees; ArduSub/config.h:152 DEFAULT_ANGLE_MAX.
    # Caps the lean angle the pilot can command.
    lean_angle_max_cd: 4500.0

    # JS_GAIN_DEFAULT (ArduSub/Parameters.cpp:304), clamped 0.1..1.0.
    # This does NOT scale any output -- see the README. Its only effect is
    # shrinking the STABILIZE yaw deadzone (mode_stabilize.cpp:35).
    pilot_gain: 0.5

    publish_rate_hz: 50.0

    # Leave false for anything other than isolated bench testing without
    # mavros/state available -- see sitl_node.py's warning.
    assume_armed_for_testing: true
